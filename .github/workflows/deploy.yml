# Day 38: main への push で API イメージをビルドし、ECR に push して App Runner
# を更新するデプロイワークフロー。
#
# 有効化の前提(手順は docs/runbooks/production-cutover.md §10):
#   - Terraform で enable_apprunner_service = true(App Runner サービス作成済)
#   - GitHub Secrets: AWS_DEPLOY_ROLE_ARN(cicd.tf の github_deploy ロール)、
#     APPRUNNER_SERVICE_ARN(apprunner.tf の出力)
#   - GitHub Variables: AWS_BOOTSTRAPPED=true
#
# ECR は IMMUTABLE タグ(Day 34)のため、イメージタグはコミット SHA を使う。

name: Deploy API to App Runner

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  id-token: write # OIDC で AWS ロールを assume するために必要
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: shipyard/api

jobs:
  deploy:
    # AWS ブートストラップ前は失敗ではなく skip にする。AWS アカウント作成 +
    # terraform apply 完了 + Secrets 投入が済んだら、GitHub の Settings →
    # Variables で AWS_BOOTSTRAPPED=true に設定すると自動的に走り始める。
    if: ${{ vars.AWS_BOOTSTRAPPED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR は IMMUTABLE タグのため、同じコミット SHA のイメージが既にあると push が
      # `tag invalid: ... cannot be overwritten` で失敗する。デプロイ段階で失敗した run を
      # 再実行するケース(インフラ修正後のリトライ、同一コミットでの workflow_dispatch)では
      # push だけ先に成功しているのが普通なので、既存タグならビルドごとスキップして
      # デプロイ段階へ進む。イメージの中身はコミット SHA で一意に決まるため再ビルドは不要。
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          if aws ecr describe-images \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
            echo "同一タグのイメージが既に存在するため、ビルドと push をスキップします: $GITHUB_SHA"
            exit 0
          fi

          docker build -t "$IMAGE" -f apps/api/Dockerfile .
          docker push "$IMAGE"

      # 新しいイメージタグへ更新する。
      #
      # 【重要】UpdateService の SourceConfiguration は「マージ」ではなく「置き換え」。
      # イメージタグだけを組み立てて渡すと、Terraform(apprunner.tf)が設定した
      # RuntimeEnvironmentVariables(APP_BASE_URL / MAIL_FROM)、
      # RuntimeEnvironmentSecrets(Secrets Manager の 10 キー)、
      # AuthenticationConfiguration(ECR pull 用アクセスロール)が消える。
      # 消えると「起動はするが DB / Stripe / AI に繋がらない」「ECR pull に失敗する」
      # という状態になるため、現在の設定を describe-service で取得し、
      # ImageIdentifier だけを差し替えて渡す。
      - name: Deploy to App Runner
        env:
          SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          set -euo pipefail

          CURRENT=$(aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" \
            --query 'Service.SourceConfiguration' --output json)

          # ImageIdentifier を差し替えつつ、describe が返す null フィールド
          # (ECR 利用時の ConnectionArn 等)を落とす。null を渡すと
          # update-service がバリデーションエラーになるため。
          NEW=$(printf '%s' "$CURRENT" \
            | jq --arg img "$IMAGE" '.ImageRepository.ImageIdentifier = $img' \
            | jq 'walk(if type == "object" then with_entries(select(.value != null)) else . end)')

          # 設定が取れていない状態で update を投げると本番の env / secrets を
          # 空にしてしまうため、投入前に検算する。
          SECRET_COUNT=$(printf '%s' "$NEW" \
            | jq '.ImageRepository.ImageConfiguration.RuntimeEnvironmentSecrets // {} | length')
          if [ "$SECRET_COUNT" -eq 0 ]; then
            echo "::error::RuntimeEnvironmentSecrets が空です。App Runner の設定を terraform apply で復旧してから再実行してください。"
            exit 1
          fi
          echo "runtime secrets: $SECRET_COUNT keys / image: $IMAGE"

          OPERATION_ID=$(aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "$NEW" \
            --query 'OperationId' --output text)
          echo "OPERATION_ID=$OPERATION_ID" >> "$GITHUB_ENV"

      # update-service は非同期。完了を待たないとデプロイ失敗を検知できず
      # ワークフローが緑のまま終わるため、オペレーションの終了まで待つ。
      - name: Wait for deployment
        env:
          SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 60); do   # 15s × 60 = 最大 15 分
            STATUS=$(aws apprunner list-operations \
              --service-arn "$SERVICE_ARN" \
              --query "OperationSummaryList[?Id=='$OPERATION_ID'].Status | [0]" \
              --output text)

            case "$STATUS" in
              SUCCEEDED)
                echo "deployment succeeded"
                exit 0
                ;;
              PENDING|IN_PROGRESS)
                sleep 15
                ;;
              *)
                echo "::error::App Runner のデプロイが失敗しました (status=$STATUS)。App Runner のアプリケーションログを確認してください。"
                exit 1
                ;;
            esac
          done

          echo "::error::App Runner のデプロイが 15 分以内に完了しませんでした (operation=$OPERATION_ID)。"
          exit 1
